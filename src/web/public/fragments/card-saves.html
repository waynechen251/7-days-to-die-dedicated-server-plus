<section class="card card-saves">
  <header class="card-header">
    <h2 class="card-title" data-i18n="card.saves.title">存檔管理</h2>
    <div class="btn-bar">
      <button
        id="refreshSavesBtn"
        class="btn btn--ghost"
        data-i18n="card.saves.refresh"
        data-i18n-title="card.saves.refreshTitle"
        title="重新整理存檔/備份清單"
      >
        🔄 重新整理
      </button>
    </div>
  </header>

  <div class="saves-summary">
    <span><b id="saves-sum-worlds">—</b> <span data-i18n="card.saves.sumWorlds">世界</span></span>
    <span><b id="saves-sum-saves">—</b> <span data-i18n="card.saves.sumSaves">存檔</span></span>
    <span><b id="saves-sum-backups">—</b> <span data-i18n="card.saves.sumBackups">備份</span></span>
  </div>

  <div id="saves-overview" class="saves-overview-list"></div>

  <div class="row">
    <button id="saves-open-manage-btn" data-i18n="card.saves.openManageBtn">📂 開啟存檔管理</button>
  </div>
</section>
