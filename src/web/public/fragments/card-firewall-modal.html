<div id="firewallAdvancedModal" class="modal hidden" aria-hidden="true">
  <div class="modal__backdrop"></div>
  <div
    class="modal__panel"
    role="dialog"
    aria-modal="true"
    aria-label="防火牆進階設定"
    data-i18n-aria-label="modal.firewall.ariaLabel"
  >
    <div class="modal__header">
      <h3 data-i18n="modal.firewall.title">防火牆進階設定與規則明細</h3>
      <button id="fw-modal-close-btn" class="modal__close" data-i18n="common.close">✖</button>
    </div>
    <div class="modal__body">
      <div class="firewall-modal-sections">

        <section class="firewall-panel">
          <span class="field__label" data-i18n="card.firewall.policyLabel">自動化策略</span>
          <div class="firewall-policy-grid">
            <label class="firewall-toggle">
              <input type="checkbox" id="fw-toggle-auto-manage" />
              <div class="firewall-toggle__copy">
                <span class="firewall-toggle__title" data-i18n="card.firewall.autoManage">遊戲伺服器啟動時自動套用規則</span>
                <span class="firewall-toggle__hint" data-i18n="card.firewall.autoManageHint">每次啟動遊戲伺服器時，自動執行「同步所有規則」</span>
              </div>
            </label>

            <label class="firewall-toggle">
              <input type="checkbox" id="fw-toggle-remove-on-stop" />
              <div class="firewall-toggle__copy">
                <span class="firewall-toggle__title" data-i18n="card.firewall.removeOnStop">遊戲伺服器停止時自動移除規則</span>
                <span class="firewall-toggle__hint" data-i18n="card.firewall.removeOnStopHint">遊戲伺服器停止後，只自動移除遊戲用規則，不移除管理用規則</span>
              </div>
            </label>

            <label class="firewall-toggle">
              <input type="checkbox" id="fw-toggle-game-ports" />
              <div class="firewall-toggle__copy">
                <span class="firewall-toggle__title" data-i18n="card.firewall.openGamePorts">遊戲用埠（依 ServerPort 開放 TCP+UDP，並開放 ServerPort+1~+3 的 UDP）</span>
                <span class="firewall-toggle__hint" data-i18n="card.firewall.scopeGameHint">對外玩家連線主要依賴這組規則。</span>
              </div>
            </label>

            <div class="firewall-toggle firewall-toggle--stacked">
              <label class="firewall-toggle__row">
                <input type="checkbox" id="fw-toggle-mgmt-ports" />
                <div class="firewall-toggle__copy">
                  <span class="firewall-toggle__title" data-i18n="card.firewall.openMgmtPorts">管理用埠（依後台/Telnet/WebDashboard 設定值開放 TCP）</span>
                  <span class="firewall-toggle__hint" data-i18n="card.firewall.scopeMgmtHint">只在需要遠端維運時開啟，避免暴露多餘入口。</span>
                </div>
              </label>
              <div id="fw-mgmt-local-only" class="hidden firewall-toggle__notice" data-i18n="card.firewall.mgmtPortsLocalOnlyReason">管理用埠設定僅允許從 localhost 修改，避免遠端連線被自己關掉。</div>
            </div>
          </div>
        </section>

        <section class="firewall-panel">
          <div class="firewall-panel__header">
            <div>
              <span class="field__label" data-i18n="card.firewall.rulesLabel">目前納入管理的規則</span>
              <div class="firewall-panel__hint" data-i18n="card.firewall.rulesManagedHint">預設只顯示日常判讀需要的資訊；原始名稱在進階區查看。</div>
            </div>
          </div>

          <div id="fw-rules-empty" class="hidden firewall-empty" data-i18n="card.firewall.rulesEmpty">（目前無規則）</div>
          <table id="fw-rules-table" class="hidden firewall-table">
            <thead>
              <tr>
                <th data-i18n="card.firewall.col.status">狀態</th>
                <th data-i18n="card.firewall.col.use">用途</th>
                <th data-i18n="card.firewall.col.endpoint">埠 / 協定</th>
              </tr>
            </thead>
            <tbody id="fw-rules-tbody"></tbody>
          </table>

          <details id="fw-advanced-details" class="firewall-advanced hidden">
            <summary data-i18n="card.firewall.advancedSummary">顯示進階規則與原始名稱</summary>

            <div class="firewall-advanced__section">
              <span class="field__label" data-i18n="card.firewall.rawRulesLabel">已納入管理的原始規則</span>
              <div id="fw-raw-rules-empty" class="hidden firewall-empty" data-i18n="card.firewall.rulesEmpty">（目前無規則）</div>
              <table id="fw-raw-rules-table" class="hidden firewall-table firewall-table--raw">
                <thead>
                  <tr>
                    <th data-i18n="card.firewall.col.status">狀態</th>
                    <th data-i18n="card.firewall.col.group">群組</th>
                    <th data-i18n="card.firewall.col.port">埠</th>
                    <th data-i18n="card.firewall.col.protocol">協定</th>
                    <th data-i18n="card.firewall.col.name">規則名稱</th>
                  </tr>
                </thead>
                <tbody id="fw-raw-rules-tbody"></tbody>
              </table>
            </div>

            <div id="fw-all-rules-section" class="hidden firewall-advanced__section">
              <span class="field__label" data-i18n="card.firewall.allRulesLabel">全部候選規則</span>
              <div id="fw-all-rules-empty" class="hidden firewall-empty" data-i18n="card.firewall.rulesEmpty">（目前無規則）</div>
              <table id="fw-all-rules-table" class="hidden firewall-table firewall-table--raw">
                <thead>
                  <tr>
                    <th data-i18n="card.firewall.col.status">狀態</th>
                    <th data-i18n="card.firewall.col.group">群組</th>
                    <th data-i18n="card.firewall.col.port">埠</th>
                    <th data-i18n="card.firewall.col.protocol">協定</th>
                    <th data-i18n="card.firewall.col.name">規則名稱</th>
                  </tr>
                </thead>
                <tbody id="fw-all-rules-tbody"></tbody>
              </table>
            </div>
          </details>
        </section>

      </div>
    </div>
    <div class="modal__footer">
      <button id="fw-modal-close-btn2" class="btn" data-i18n="common.close">關閉</button>
    </div>
  </div>
</div>
