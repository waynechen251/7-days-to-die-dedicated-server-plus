<section class="card card-game-main">
  <header class="card-header">
    <h2 class="card-title" data-i18n="card.game.title">7 Days To Die Dedicated Server</h2>
    <div class="status-inline">
      <span id="st-steam" class="badge" data-i18n="console.tabSteamcmd">SteamCMD</span>
      <span id="st-game" class="badge" data-i18n="console.tabGame">7DaysToDieServer</span>
      <span id="st-telnet" class="badge" data-i18n="console.tabTelnet">Telnet</span>
    </div>
  </header>

  <div class="game-section game-panel">
    <div class="game-section__head">
      <span class="field__label" data-i18n="card.game.sectionInstall">版本與安裝</span>
      <span id="versionSourceBadge" class="badge" data-i18n="card.game.versionSourceLoading">載入中</span>
    </div>
    <label class="field field--version-select">
      <div class="row">
        <span id="gameSelectedVersionBadge" class="badge" data-i18n="card.game.lastInstallVersion">上次安裝版本:</span>
      </div>
      <div class="row" style="width: 100%; align-items: stretch">
        <select id="versionSelect" style="flex: 1">
          <option value="" data-i18n="common.loading">載入中...</option>
        </select>
        <button
          id="installServerBtn"
          data-i18n="card.game.installUpdate"
          data-danger-i18n="confirm.installServer"
          data-cancel-i18n="common.cancel"
          data-continue-i18n="common.confirm"
          style="white-space: nowrap"
        >
          📥 安裝 / 更新
        </button>
      </div>
    </label>
  </div>

  <div id="gameRuntimeSection" class="game-section game-panel hidden">
    <div class="game-section__head">
      <span class="field__label" data-i18n="card.game.sectionRuntime">即時狀態</span>
      <span id="statsUpdatedBadge" class="badge"><span data-i18n="card.game.statsUpdatedAt">更新於:</span> -</span>
      <span id="gameVersionBadge" class="badge"><span data-i18n="card.game.version">版本:</span> -</span>
    </div>
    <div class="game-stat-grid">
      <div class="game-stat">
        <span id="onlinePlayersBadge" class="game-stat__value">-</span>
        <span class="game-stat__label" data-i18n="card.game.statPlayers">玩家</span>
      </div>
      <div class="game-stat">
        <span id="fpsBadge" class="game-stat__value">-</span>
        <span class="game-stat__label" data-i18n="card.game.statFps">FPS</span>
      </div>
      <div class="game-stat">
        <span id="zomBadge" class="game-stat__value">-</span>
        <span class="game-stat__label" data-i18n="card.game.statZombies">殭屍</span>
      </div>
      <div class="game-stat">
        <span id="heapBadge" class="game-stat__value">-</span>
        <span class="game-stat__label" data-i18n="card.game.statHeap">Heap</span>
      </div>
      <div class="game-stat">
        <span id="maxBadge" class="game-stat__value">-</span>
        <span class="game-stat__label" data-i18n="card.game.statMax">Max</span>
      </div>
      <div class="game-stat">
        <span id="rssBadge" class="game-stat__value">-</span>
        <span class="game-stat__label" data-i18n="card.game.statRss">RSS</span>
      </div>
    </div>
  </div>

  <div class="game-section game-panel">
    <div class="game-section__head">
      <span class="field__label" data-i18n="card.game.sectionControl">伺服器控制</span>
    </div>
    <div class="row">
      <button id="configStartBtn" data-i18n="card.game.startServer">🛠 啟動伺服器</button>
      <button
        id="stopServerBtn"
        data-i18n="card.game.stopServer"
        data-danger-i18n="confirm.stopServer"
        data-cancel-i18n="common.cancel"
        data-continue-i18n="common.confirm"
      >
        ⏹️ 正常結束
      </button>
      <button
        id="killServerBtn"
        data-i18n="card.game.killServer"
        data-danger-i18n="confirm.killServer"
        data-cancel-i18n="common.cancel"
        data-continue-i18n="common.confirm"
      >
        ⚠️ 強制結束
      </button>
    </div>
    <div class="row">
      <input id="telnetInput" data-i18n-placeholder="card.game.telnetPlaceholder" placeholder="輸入 Telnet 指令…" />
      <button id="telnetSendBtn" data-role="telnet" data-i18n="card.game.telnetSend">送出</button>
      <button data-role="telnet" onclick="sendTelnet('getgamepref')" data-i18n="card.game.telnetSettings">
        ⚙️ 設定
      </button>
    </div>
  </div>
</section>
